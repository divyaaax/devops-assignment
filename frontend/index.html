<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DevOps Task Notifier</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #020617;
        border-radius: 0.75rem;
        padding: 2rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        width: 100%;
        max-width: 500px;
        border: 1px solid #1f2937;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        color: #f9fafb;
      }
      p {
        margin: 0 0 1.25rem;
        color: #9ca3af;
        font-size: 0.95rem;
        line-height: 1.4;
      }
      .api-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.75rem;
        background: #1e293b;
        color: #94a3b8;
        padding: 0.2rem 0.5rem;
        border-radius: 0.375rem;
        margin-bottom: 1.25rem;
        word-break: break-all;
      }
      .api-badge span.dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #22c55e;
      }
      label {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.9rem;
        color: #e5e7eb;
      }
      input {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid #374151;
        background: #0f172a;
        color: #e5e7eb;
        font-size: 0.95rem;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border-color: #22c55e;
        box-shadow: 0 0 0 1px #22c55e33;
      }
      button {
        margin-top: 0.85rem;
        width: 100%;
        padding: 0.7rem 1rem;
        border-radius: 0.5rem;
        border: none;
        background: #22c55e;
        color: #022c22;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: background 0.15s ease, transform 0.05s ease,
          box-shadow 0.05s ease;
      }
      button:hover:not(:disabled) {
        background: #16a34a;
        box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
        transform: translateY(-1px);
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #022c22;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .status {
        margin-top: 1.25rem;
        padding: 0.85rem 1rem;
        border-radius: 0.5rem;
        background: #090d16;
        border: 1px solid #1f2937;
        font-size: 0.9rem;
        word-break: break-word;
      }
      .status-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.4rem;
      }
      .status-label {
        font-weight: 600;
        color: #94a3b8;
        font-size: 0.85rem;
      }
      .status-value {
        color: #a5b4fc;
        font-family: monospace;
      }
      .status-chip {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .status-chip.in-progress {
        background: #1e293b;
        color: #93c5fd;
        border: 1px solid #3b82f644;
      }
      .status-chip.completed {
        background: #064e3b;
        color: #a7f3d0;
        border: 1px solid #10b98166;
      }
      .status-chip.failed {
        background: #7f1d1d;
        color: #fecaca;
        border: 1px solid #ef444466;
      }
      .progress-wrap {
        margin-top: 0.75rem;
      }
      .progress-bar {
        height: 6px;
        background: #1e293b;
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #22c55e, #4ade80);
        border-radius: 999px;
        transition: width 0.3s ease;
      }
      .progress-msg {
        margin-top: 0.4rem;
        font-size: 0.8rem;
        color: #9ca3af;
      }
      .result-box {
        margin-top: 0.75rem;
        padding: 0.6rem 0.75rem;
        border-radius: 0.375rem;
        background: #022c22;
        border: 1px solid #059669;
        color: #6ee7b7;
        font-size: 0.85rem;
      }
      .error {
        margin-top: 0.75rem;
        padding: 0.6rem 0.75rem;
        border-radius: 0.375rem;
        background: #450a0a;
        border: 1px solid #b91c1c;
        color: #fecaca;
        font-size: 0.85rem;
      }
      .details-toggle {
        margin-top: 1rem;
        font-size: 0.75rem;
        color: #64748b;
        cursor: pointer;
        user-select: none;
      }
      .details-toggle:hover {
        color: #94a3b8;
      }
      .config-input {
        margin-top: 0.5rem;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Task Notifier</h1>
      <p>Trigger an asynchronous Celery task and track its distributed lifecycle in real time.</p>

      <div class="api-badge" id="api-badge" title="Target Backend API Base">
        <span class="dot"></span>
        API: <span id="api-endpoint-text">Resolving...</span>
      </div>

      <label for="email">Recipient Email</label>
      <input
        id="email"
        type="email"
        placeholder="engineer@example.com"
        autocomplete="off"
      />
      <button id="notify-btn">
        <span id="btn-text">Send notification</span>
      </button>

      <!-- Realtime Status Dashboard -->
      <div id="status" class="status" style="display: none">
        <div class="status-line">
          <span class="status-label">Task ID:</span>
          <span id="task-id" class="status-value"></span>
        </div>
        <div class="status-line">
          <span class="status-label">Status:</span>
          <span id="task-status" class="status-chip in-progress">PENDING</span>
        </div>
        
        <div id="progress-wrap" class="progress-wrap" style="display: none">
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <div id="progress-msg" class="progress-msg">Worker processing task…</div>
        </div>

        <div id="task-result-box" class="result-box" style="display: none">
          <strong>Result:</strong> <span id="task-result"></span>
        </div>
      </div>

      <div id="error" class="error" style="display: none"></div>

      <!-- Configurable endpoint helper -->
      <div class="details-toggle" id="toggle-config">⚙ Override API Endpoint</div>
      <div id="config-wrap" class="config-input">
        <label for="api-override" style="font-size: 0.75rem;">Backend URL (e.g. http://localhost:8000 or ALB DNS):</label>
        <input id="api-override" type="text" placeholder="http://localhost:8000" />
      </div>
    </div>

    <script>
      // =======================================================================
      // Dynamic API Base URL Resolution
      // =======================================================================
      function resolveApiBase() {
        // 1. Check query parameter ?api=
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("api")) {
          return urlParams.get("api").replace(/\/$/, "");
        }
        // 2. Check localStorage override
        const stored = localStorage.getItem("devops_api_base");
        if (stored) return stored.replace(/\/$/, "");
        // 3. Same-origin if served via HTTP/HTTPS (FastAPI or ALB)
        if (window.location.protocol.startsWith("http")) {
          return window.location.origin;
        }
        // 4. Default fallback for file:/// protocol
        return "http://localhost:8000";
      }

      let API_BASE = resolveApiBase();
      const apiEndpointText = document.getElementById("api-endpoint-text");
      apiEndpointText.textContent = API_BASE;

      const emailInput = document.getElementById("email");
      const notifyBtn = document.getElementById("notify-btn");
      const btnText = document.getElementById("btn-text");
      const statusBox = document.getElementById("status");
      const taskIdEl = document.getElementById("task-id");
      const taskStatusEl = document.getElementById("task-status");
      const taskResultBox = document.getElementById("task-result-box");
      const taskResultEl = document.getElementById("task-result");
      const errorEl = document.getElementById("error");
      const progressWrap = document.getElementById("progress-wrap");
      const progressFill = document.getElementById("progress-fill");
      const progressMsg = document.getElementById("progress-msg");
      const toggleConfig = document.getElementById("toggle-config");
      const configWrap = document.getElementById("config-wrap");
      const apiOverrideInput = document.getElementById("api-override");

      apiOverrideInput.value = API_BASE;
      toggleConfig.addEventListener("click", () => {
        configWrap.style.display = configWrap.style.display === "block" ? "none" : "block";
      });
      apiOverrideInput.addEventListener("change", (e) => {
        const val = e.target.value.trim();
        if (val) {
          localStorage.setItem("devops_api_base", val);
          API_BASE = val.replace(/\/$/, "");
          apiEndpointText.textContent = API_BASE;
        }
      });

      const TASK_EST_SEC = 6;
      const MAX_POLL_ATTEMPTS = 30; // 60 seconds maximum timeout
      let pollTimer = null;
      let progressInterval = null;
      let pollAttempts = 0;

      function startProgress() {
        progressWrap.style.display = "block";
        progressFill.style.width = "0%";
        progressMsg.textContent = "Worker processing task in background…";
        let p = 0;
        const step = 100 / (TASK_EST_SEC * 10);
        progressInterval = setInterval(() => {
          p = Math.min(p + step, 95);
          progressFill.style.width = p + "%";
        }, 100);
      }

      function finishProgress(success = true) {
        if (progressInterval) {
          clearInterval(progressInterval);
          progressInterval = null;
        }
        progressFill.style.width = "100%";
        progressMsg.textContent = success ? "Execution completed." : "Task ended with failure.";
      }

      function clearTimers() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
        if (progressInterval) {
          clearInterval(progressInterval);
          progressInterval = null;
        }
      }

      function setError(msg) {
        if (!msg) {
          errorEl.style.display = "none";
          errorEl.textContent = "";
          return;
        }
        errorEl.style.display = "block";
        errorEl.textContent = msg;
      }

      function setStatusChip(status) {
        const s = (status || "").toLowerCase();
        taskStatusEl.classList.remove("in-progress", "completed", "failed");
        if (s === "completed") {
          taskStatusEl.classList.add("completed");
          taskStatusEl.textContent = "COMPLETED";
        } else if (s === "failed") {
          taskStatusEl.classList.add("failed");
          taskStatusEl.textContent = "FAILED";
        } else {
          taskStatusEl.classList.add("in-progress");
          taskStatusEl.textContent = "IN PROGRESS";
        }
      }

      async function pollStatus(taskId) {
        pollAttempts++;
        if (pollAttempts > MAX_POLL_ATTEMPTS) {
          clearTimers();
          setError("Polling timed out after 60 seconds. Worker may be delayed or unavailable.");
          finishProgress(false);
          notifyBtn.disabled = false;
          btnText.textContent = "Send notification";
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/task_status/${encodeURIComponent(taskId)}`);
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || `HTTP ${res.status}`);
          }
          const data = await res.json();
          setStatusChip(data.status);

          if (data.status === "completed") {
            clearTimers();
            finishProgress(true);
            if (data.result) {
              taskResultBox.style.display = "block";
              taskResultEl.textContent = data.result;
            }
            notifyBtn.disabled = false;
            btnText.textContent = "Send notification";
          } else if (data.status === "failed") {
            clearTimers();
            finishProgress(false);
            setError(data.error ? `Task failed: ${data.error}` : "Task failed during execution.");
            notifyBtn.disabled = false;
            btnText.textContent = "Send notification";
          }
        } catch (err) {
          clearTimers();
          finishProgress(false);
          setError(`Status inspection error: ${err.message}`);
          notifyBtn.disabled = false;
          btnText.textContent = "Send notification";
        }
      }

      async function notify() {
        setError(null);
        clearTimers();
        pollAttempts = 0;

        const email = emailInput.value.trim();
        if (!email) {
          setError("Email address is required.");
          return;
        }
        if (!/^[\w\.-]+@[\w\.-]+\.\w+$/.test(email)) {
          setError("Please enter a valid email address (e.g. dev@example.com).");
          return;
        }

        notifyBtn.disabled = true;
        btnText.innerHTML = '<span class="spinner"></span> Enqueuing…';

        try {
          const res = await fetch(
            `${API_BASE}/notify/?email=${encodeURIComponent(email)}`,
            { method: "POST" }
          );
          if (!res.ok) {
            const errBody = await res.json().catch(() => ({}));
            throw new Error(errBody.detail || `Server returned HTTP ${res.status}`);
          }

          const data = await res.json();
          const taskId = data.task_id;

          taskIdEl.textContent = taskId || "Unknown";
          setStatusChip("in progress");
          taskResultBox.style.display = "none";
          taskResultEl.textContent = "";
          statusBox.style.display = "block";
          startProgress();

          if (taskId) {
            pollTimer = setInterval(() => pollStatus(taskId), 2000);
          }
        } catch (err) {
          setError(`Failed to trigger notification: ${err.message}`);
          notifyBtn.disabled = false;
          btnText.textContent = "Send notification";
        }
      }

      notifyBtn.addEventListener("click", notify);
      emailInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          notify();
        }
      });
    </script>
  </body>
</html>
